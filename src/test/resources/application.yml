spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: test
          jwk-set-uri: test

keycloak:
  admin:
    server-url: test
    realm: test
    client-id: test
    client-secret: test

codabli:
  llm:
    base-url: https://test.ai.cloud.ovh.net/v1
    api-key: test-api-key
    model: test-model
    system-prompt: Test system prompt
    temperature: 0.3
    max-tokens: 256
    timeout: 5s
    standby-message: Test standby message