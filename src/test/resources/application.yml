spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 501MB
      file-size-threshold: 0B
  datasource:
    url: 'jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS codabli_test\;SET SCHEMA codabli_test'
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: codabli_test
        type:
          json_format_mapper: com.codabli.config.LectureJsonTolerante
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: codabli_test
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: test
          jwk-set-uri: test

keycloak:
  admin:
    server-url: test
    realm: test
    client-id: test
    client-secret: test

codabli:
  llm:
    base-url: https://test.ai.cloud.ovh.net/v1
    api-key: test-api-key
    model: test-model
    system-prompt: classpath:prompts/assistant-ia/system-prompt.txt
    temperature: 0.3
    max-tokens: 256
    timeout: 5s
    standby-message: Test standby message
  qwen-guard:
    model: Qwen3Guard-Gen-0.6B
    timeout: 5s

ovh:
  storage:
    access-key: test
    secret-key: test
    region: gra # ex: gra, sbg, bhs
    bucket-name: test
    endpoint: http://localhost:9090
    path-style-access-enabled: true
    max-file-size: 500MB
    api-call-timeout: 15m
    api-call-attempt-timeout: 5m
    presigned-url-ttl: 15m

media:
  upload:
    allow-without-antivirus: false
  cleanup:
    enabled: false
    fixed-delay-ms: 60000
    orphan-age: 24h
