spring:
  application:
    name: codabli-backend
  servlet:
    multipart:
      max-file-size: ${S3_MAX_FILE_SIZE:500MB}
      max-request-size: ${S3_MAX_REQUEST_SIZE:501MB}
      file-size-threshold: 0B
  datasource:
    url: jdbc:postgresql://localhost:5442/${POSTGRES_DB:codabli_dev}?currentSchema=${POSTGRES_SCHEMA:codabli}
    username: ${POSTGRES_USER:codabli}
    password: ${POSTGRES_PASSWORD:codabli}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:codabli}
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: ${POSTGRES_SCHEMA:codabli}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8081}/realms/codabli
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8081}/realms/codabli/protocol/openid-connect/certs

server:
  port: 8082

keycloak:
  admin:
    server-url: ${KEYCLOAK_URL:http://localhost:8081/}
    realm: ${KEYCLOAK_REALM:codabli}
    client-id: ${KEYCLOAK_ADMIN_MANAGEMENT_CLIENT_ID:codabli-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:changeme-dev-secret}

# Client LLM souverain — OVHcloud AI Endpoints (EA-107).
# base-url DOIT cibler un endpoint OVH en HTTPS (garde-fou au demarrage).
# La cle API provient d'une variable d'environnement, jamais en dur ni loguee.
codabli:
  llm:
    base-url: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
    api-key: ${OVH_AI_ENDPOINT_API_KEY:changeme-dev-key}
    model: Mistral-Small-3.2-24B-Instruct-2506
    # Prompt systeme global, toujours ajoute en premier avant les messages du client.
    system-prompt: |
      # RÔLE ET IDENTITÉ
      Tu es l'assistant pédagogique de la plateforme Codabli (Conte Dansé®). Ton objectif exclusif est de guider des enfants (4 à 12 ans) dans la création et l'écriture de leur propre conte. Tu adoptes une posture socratique bienveillante et structurée.

      # RÈGLES ABSOLUES (INTERDICTION DE SUBSTITUTION CRÉATIVE)
      - NE RÉDIGE JAMAIS à la place de l'élève. Tu ne dois générer aucun résumé, aucune description, aucune réponse personnelle, ni aucun passage narratif du conte.
      - N'exécute pas les tâches de création. Ton rôle est d'accompagner, de questionner, de suggérer du vocabulaire ou de rappeler des règles de grammaire. C'est la classe qui écrit son texte, lettre après lettre, mot après mot.

      # MÉCANIQUE D'INTERACTION (MODE RÉFLEXION)
      - Relance toujours par le questionnement : Lorsqu'une classe te sollicite, ne fournis pas de réponse directe ou de solution "clé en main". Fais avancer la réflexion en posant une question ouverte adaptée à l'étape du conte (Cadre, Personnages, Élément perturbateur, etc.).
      - Limitation de la génération d'idées : Si la classe est totalement bloquée et demande des idées, fournis un MAXIMUM DE 3 PISTES sous forme de questions ouvertes, d'indices ou de choix de vocabulaire.
      - Laisse le choix : Conclus toujours tes suggestions en précisant que la classe a le droit de refuser ces pistes et d'inventer sa propre idée.

      # GARDE-FOUS ÉTHIQUES ET SÉCURITÉ
      - Interdiction stricte d'évaluation : Tu ne dois en aucun cas noter le travail, classer les élèves, évaluer leur niveau scolaire ou formuler des jugements de valeur sur leurs capacités.
      - Interdiction de profilage : Tu ne dois dresser aucun profil psychologique ni formuler de conseil d'orientation.
      - Maintiens un ton encourageant, patient et adapté aux enfants, sans jamais générer de contenu effrayant ou inapproprié.
    temperature: 0.3
    max-tokens: 1024
    timeout: 60s
    standby-message: "Oups, la magie fait une petite pause. Reessaie dans un instant !"

# Ne jamais exposer la configuration (dont la cle API) via Actuator (RGPD/securite).
management:
  endpoint:
    env:
      show-values: never
    configprops:
      show-values: never

ovh:
  storage:
    access-key: ${S3_ACCESS_KEY:access_key}
    secret-key: ${S3_SECRET_KEY:secret_key}
    region: ${S3_REGION:gra}
    bucket-name: ${S3_BUCKET:codabli}
    endpoint: ${S3_ENDPOINT:}
    path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:false}
    max-file-size: ${S3_MAX_FILE_SIZE:500MB}
    api-call-timeout: ${S3_API_CALL_TIMEOUT:15m}
    api-call-attempt-timeout: ${S3_API_CALL_ATTEMPT_TIMEOUT:5m}
    presigned-url-ttl: ${S3_PRESIGNED_URL_TTL:15m}

media:
  upload:
    allow-without-antivirus: ${MEDIA_UPLOAD_ALLOW_WITHOUT_ANTIVIRUS:false}
  cleanup:
    enabled: ${MEDIA_CLEANUP_ENABLED:true}
    fixed-delay-ms: ${MEDIA_CLEANUP_FIXED_DELAY_MS:3600000}
    orphan-age: ${MEDIA_ORPHAN_AGE:24h}
