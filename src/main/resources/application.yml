spring:
  application:
    name: codabli-backend
  datasource:
    url: jdbc:postgresql://localhost:5442/${POSTGRES_DB:codabli_dev}?currentSchema=${POSTGRES_SCHEMA:codabli}
    username: ${POSTGRES_USER:codabli}
    password: ${POSTGRES_PASSWORD:codabli}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:codabli}
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: ${POSTGRES_SCHEMA:codabli}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/codabli
          jwk-set-uri: http://localhost:8081/realms/codabli/protocol/openid-connect/certs

server:
  port: 8082

keycloak:
  admin:
    server-url: http://localhost:8081
    realm: codabli
    client-id: codabli-backend
    client-secret: ${KEYCLOAK_CLIENT_SECRET:changeme-dev-secret}
