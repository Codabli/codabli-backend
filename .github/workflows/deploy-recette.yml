name: Deploy recette

# Déclenché à chaque push sur develop (+ lancement manuel possible).
# Chaîne : build image -> push GHCR -> SSH sur la VM -> compose pull && up.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Évite deux déploiements backend simultanés (le dernier push gagne).
concurrency:
  group: deploy-recette-backend
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/codabli/codabli-backend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # nécessaire pour pousser sur GHCR avec GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .             # le Dockerfile est à la racine du repo
          push: true
          tags: |
            ${{ env.IMAGE }}:recette
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Préparer la clé SSH de déploiement
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Déployer le backend sur la VM
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
            cd ~/codabli/codabli-infra/recette &&
            docker compose pull backend &&
            docker compose up -d --no-build backend
          '
