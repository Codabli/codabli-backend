# Infrastructure de DÉVELOPPEMENT LOCAL pour le backend Codabli.
#
# ⚠️ Ce fichier n'est PAS l'environnement de recette. La recette est décrite dans
#    le repo `codabli-infra` (codabli-infra/recette/docker-compose.yml) : mode prod
#    Keycloak `start`, reverse-proxy Caddy, images tirées de GHCR. Ici c'est du
#    `start-dev`, HTTP direct, build local — volontairement différent.
#
# 🔖 Versions d'images (Keycloak, Postgres…) : l'autorité est la RECETTE. Ce compose
#    de dev doit SUIVRE les versions de `codabli-infra/recette`. Les bumps arrivent
#    par PR (Renovate/Dependabot) dans chaque repo ; garder les deux alignés.
#
#   docker compose up -d      -> démarre PostgreSQL + Keycloak
#   docker compose down       -> arrête (les données sont conservées dans les volumes)
#   docker compose down -v    -> arrête ET supprime les données (repart de zéro)
#
# Le backend Spring Boot NE tourne PAS dans Docker : il se lance sur l'hôte
# avec `./mvnw spring-boot:run` et joint ces services via localhost.
# C'est volontaire : cela garantit que l'`issuer` des jetons Keycloak
# (http://localhost:8081/realms/codabli) correspond à celui attendu par l'app.

services:
  postgres:
    image: postgres:16-alpine
    container_name: codabli-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codabli_dev}
      POSTGRES_USER: ${POSTGRES_USER:-codabli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codabli}
    # Le port 5432 de l'hôte est déjà occupé par un autre projet :
    # on expose PostgreSQL sur 5442 côté hôte (5432 dans le conteneur).
    ports:
      - "5442:5432"
    volumes:
      - codabli-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service ponctuel : cree le schema, sans copier ni supprimer les donnees.
  postgres-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-codabli_dev}
      PGUSER: ${POSTGRES_USER:-codabli}
      PGPASSWORD: ${POSTGRES_PASSWORD:-codabli}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-codabli}
    command:
      - sh
      - -ec
      - 'psql --no-psqlrc --set=ON_ERROR_STOP=1 --set=schema="$$POSTGRES_SCHEMA" --file=/init-schema.sql'
    volumes:
      - ./infrastructure/db/init-schema.sql:/init-schema.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: codabli-postgre-admin
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: codabli-keycloak
    command: [ "start-dev", "--import-realm" ]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      # Injecté dans le conteneur pour que l'import du realm résolve
      # le placeholder ${KEYCLOAK_CLIENT_SECRET} du fichier realm-codabli.json.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    # Console d'admin Keycloak : http://localhost:8081  (admin / admin)
    # L'app attend Keycloak sur 8081 (voir application.yml -> issuer-uri).
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-codabli.json:/opt/keycloak/data/import/realm-codabli.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  s3mock:
    image: adobe/s3mock:5.2.3
    ports:
      - "9090:9090"
    environment:
      - ACCESS_KEY=${S3_ACCESS_KEY:-codabli}
      - SECRET_KEY=${S3_SECRET_KEY:-codabli}
      - INITIAL_BUCKETS=${S3_BUCKET:-codabli_bucket}
    volumes:
      - s3data:/data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico" ]
      interval: 5s
      retries: 3

  # Service OPTIONNEL : lance le backend dans un conteneur Maven+JDK 25,
  # utile si aucun JDK n'est installé sur l'hôte (seul un JRE l'est ici).
  # NON démarré par `docker compose up` : il faut le profil "app" ->
  #   docker compose --profile app up -d
  # Utilise le réseau de l'hôte pour joindre postgres (5442) et keycloak (8081)
  # via localhost, exactement comme le ferait un lancement natif `./mvnw`.
  backend:
    image: maven:3.9-eclipse-temurin-25
    container_name: codabli-backend
    profiles: [ "app" ]
    network_mode: host
    working_dir: /app
    command: [ "mvn", "-B", "spring-boot:run" ]
    environment:
      # Surcharge les valeurs par défaut d'application.yml avec celles du .env,
      # pour rester cohérent avec les identifiants de PostgreSQL et Keycloak.
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-codabli}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-codabli}
      POSTGRES_DB: ${POSTGRES_DB:-codabli_dev}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-codabli}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Cle API du LLM souverain (EA-107) : transmise au conteneur depuis le .env.
      OVH_AI_ENDPOINT_API_KEY: ${OVH_AI_ENDPOINT_API_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-codabli}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-codabli}
      S3_REGION: ${S3_REGION:-gra}
      S3_BUCKET: ${S3_BUCKET:-codabli_bucket}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9090}
      S3_PATH_STYLE_ACCESS_ENABLED: ${S3_PATH_STYLE_ACCESS_ENABLED:-true}
      S3_MAX_FILE_SIZE: ${S3_MAX_FILE_SIZE:-500MB}
      S3_MAX_REQUEST_SIZE: ${S3_MAX_REQUEST_SIZE:-501MB}
      S3_API_CALL_TIMEOUT: ${S3_API_CALL_TIMEOUT:-15m}
      S3_API_CALL_ATTEMPT_TIMEOUT: ${S3_API_CALL_ATTEMPT_TIMEOUT:-5m}
      S3_PRESIGNED_URL_TTL: ${S3_PRESIGNED_URL_TTL:-15m}
      MEDIA_UPLOAD_ALLOW_WITHOUT_ANTIVIRUS: ${MEDIA_UPLOAD_ALLOW_WITHOUT_ANTIVIRUS:-false}
      MEDIA_CLEANUP_ENABLED: ${MEDIA_CLEANUP_ENABLED:-true}
      MEDIA_CLEANUP_FIXED_DELAY_MS: ${MEDIA_CLEANUP_FIXED_DELAY_MS:-3600000}
      MEDIA_ORPHAN_AGE: ${MEDIA_ORPHAN_AGE:-24h}
    volumes:
      - .:/app
      - codabli-m2:/root/.m2
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  codabli-pgdata:
  codabli-m2:
    name: codabli-m2
  s3data:
